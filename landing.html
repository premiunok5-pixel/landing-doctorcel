<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Promos y Descuentos</title>

<style>
body{
  font-family: Arial;
  background:#0f172a;
  color:white;
  text-align:center;
  padding:40px;
}

.container{
  max-width:400px;
  margin:auto;
  background:#111827;
  padding:30px;
  border-radius:12px;
}

input{
  width:90%;
  padding:12px;
  margin:10px;
  border-radius:8px;
  border:none;
  font-size:16px;
}

button{
  background:#22c55e;
  color:white;
  padding:15px;
  width:95%;
  border:none;
  border-radius:10px;
  font-size:18px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
<h2>📱 Recibí promos y descuentos</h2>
<p>Dejanos tu WhatsApp y te avisamos ofertas exclusivas</p>

<input id="nombre" placeholder="Tu nombre">
<input id="whatsapp" placeholder="Tu WhatsApp">

<button onclick="registrar()">QUIERO RECIBIR OFERTAS</button>
</div>

<script>
function registrar(){

let nombre = document.getElementById("nombre").value;
let whatsapp = document.getElementById("whatsapp").value;

fetch("https://script.google.com/macros/s/AKfycbwWugtrBbM8v7cWp1-aHmuHmOkeb5S9ruDMWuq91GUGROdOZoj3UNI7rnYoEVUZcP4JUQ/exec", {
  method:"POST",
  body: JSON.stringify({
    nombre:nombre,
    whatsapp:whatsapp
  })
})
.then(res => res.json())
.then(data => {

  let mensaje = "Hola! Me registré para recibir promos 📱";
  let url = "https://wa.me/549"+whatsapp+"?text="+encodeURIComponent(mensaje);

  window.location.href = url;

})
}
</script>

</body>
</html>
