<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Revisión Gratis del Celular</title>

<style>
body{
font-family: Arial;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:#111827;
padding:30px;
border-radius:12px;
width:320px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,0.4);
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:none;
font-size:15px;
}

button{
width:100%;
padding:14px;
background:#22c55e;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
<h2>Revisión GRATIS del celular 📱</h2>
<p>Dejanos tu WhatsApp y te escribimos</p>

<input id="nombre" placeholder="Tu nombre">
<input id="telefono" placeholder="Tu WhatsApp">

<button onclick="enviar()">QUIERO MI DIAGNOSTICO</button>
</div>

<script>
function enviar(){

let nombre = document.getElementById("nombre").value;
let telefono = document.getElementById("telefono").value;

fetch("https://script.google.com/macros/s/AKfycbwWugtrBbM8v7cWp1-aHmuHmOkeb5S9ruDMWuq91GUGROdOZoj3UNI7rnYoEVUZcP4JUQ/exec", {
method:"POST",
body: JSON.stringify({
nombre:nombre,
telefono:telefono
})
})

.then(res => {
let mensaje = "Hola! Soy " + nombre + " y quiero mi diagnóstico gratis 📱";
window.location.href = "https://wa.me/5493454264608?text=" + encodeURIComponent(mensaje);
})
}
</script>

</body>
</html>
