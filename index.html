<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisión Gratis del Celular</title>

<style>
*{box-sizing:border-box}

body{
font-family: Arial, Helvetica, sans-serif;
background:linear-gradient(180deg,#020617,#0f172a);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:#111827;
padding:40px 25px;
border-radius:18px;
width:90%;
max-width:380px;
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,0.6);
animation: aparecer 0.6s ease;
}

@keyframes aparecer{
from{opacity:0; transform:translateY(30px)}
to{opacity:1; transform:translateY(0)}
}

/* 🔵 LOGO */
.logo{
width:180px;
margin-bottom:10px;
}

h2{
font-size:28px;
margin-bottom:10px;
}

p{
font-size:18px;
opacity:0.9;
margin-bottom:25px;
}

input{
width:100%;
padding:16px;
margin:10px 0;
border-radius:10px;
border:none;
font-size:18px;
}

button{
width:100%;
padding:18px;
margin-top:10px;
background:#22c55e;
color:white;
border:none;
border-radius:10px;
font-size:20px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

button:hover{
transform:scale(1.03);
background:#16a34a;
}
</style>
</head>

<body>

<div class="box">

<!-- 🔵 TU LOGO -->
<img src="logo.png" class="logo">

<h2>Revisión GRATIS del celular 📱</h2>
<p>Dejanos tu WhatsApp y te escribimos</p>

<form id="formLead">
<input name="nombre" placeholder="Tu nombre" required>
<input name="telefono" placeholder="Tu WhatsApp" required>
<button type="submit">QUIERO MI DIAGNÓSTICO</button>
</form>
</div>

<script>
document.getElementById("formLead").addEventListener("submit", function(e){
e.preventDefault();

var formData = new FormData(this);

fetch("https://script.google.com/macros/s/AKfycbzvzXAQ0l0Tk0DaR-kTK4xpXkaOokD-zOIXVMi3VgpHGEC3z2T3iiZZ7p3El9fXw6kQIQ/exec", {
method: "POST",
body: formData
});

var nombre = formData.get("nombre");
var mensaje = "Hola! Soy " + nombre + " y quiero mi diagnóstico gratis 📱";

window.location.href = "https://wa.me/5493454264608?text=" + encodeURIComponent(mensaje);
});
</script>

</body>
</html>
